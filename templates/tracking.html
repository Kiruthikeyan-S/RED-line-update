{% extends 'base.html' %}

{% block title %}Red Line - Tracking Donor{% endblock %}

{% block content %}
<div class="container" style="margin-top: 2rem;">
    <h2>Tracking Donor: {{ donor_name }}</h2>
    <div id="map" style="height: 80vh; width: 100%; margin-top: 1rem; border-radius: var(--radius); border: 1px solid var(--border);"></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function initMap() {
        const donorLocation = { lat: {{ donor_lat }}, lng: {{ donor_lng }} };
        const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 12,
            center: donorLocation,
        });

        const donorMarker = new google.maps.Marker({
            position: donorLocation,
            map: map,
            title: "Donor Location"
        });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                const userLocation = {
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                };
                
                const userMarker = new google.maps.Marker({
                    position: userLocation,
                    map: map,
                    title: "Your Location",
                    icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
                });

                const directionsService = new google.maps.DirectionsService();
                const directionsRenderer = new google.maps.DirectionsRenderer();
                directionsRenderer.setMap(map);

                const request = {
                    origin: userLocation,
                    destination: donorLocation,
                    travelMode: 'DRIVING'
                };

                directionsService.route(request, (result, status) => {
                    if (status == 'OK') {
                        directionsRenderer.setDirections(result);
                    }
                });
            });
        }
    }
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyArtFqUWFT5To9S752iVytNzkLIoxD6rcw&callback=initMap"></script>
{% endblock %}
