{% extends 'base.html' %}

{% block title %}Red Line - Login{% endblock %}

{% block content %}
<div class="container">
    <div class="card auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your account</p>
        
        {% if error %}
            <div class="alert alert-danger">
                <span>{{ error }}</span>
                <button class="close-btn" onclick="this.parentElement.style.display='none'">&times;</button>
            </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
            <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
            
            <div class="form-group">
                <label class="form-label" for="login_identifier">Username or Email</label>
                <input type="text" class="form-control" id="login_identifier" name="login_identifier" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <div class="form-group" style="text-align: center;">
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Log In</button>
            </div>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem;">
            Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--primary); text-decoration: none;">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
